<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <!-- Background -->
  <rect width="1200" height="800" fill="#4a7c59"/>

  <!-- Ground texture -->
  <rect width="1200" height="800" fill="url(#grass)" opacity="0.3"/>

  <!-- Main court area -->
  <rect x="50" y="50" width="1100" height="700" fill="#5a8f6a" stroke="#ffffff" stroke-width="3" rx="4"/>

  <!-- Center line -->
  <line x1="600" y1="50" x2="600" y2="750" stroke="#ffffff" stroke-width="2" stroke-dasharray="10,8"/>

  <!-- Ping Pong area (top-left) -->
  <rect x="100" y="80" width="200" height="120" fill="#3d6b4a" stroke="#ffffff" stroke-width="2" rx="2"/>
  <rect x="195" y="80" width="10" height="120" fill="#ffffff"/>
  <rect x="100" y="135" width="200" height="5" fill="#ffffff" opacity="0.5"/>
  <text x="200" y="215" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="14" font-weight="bold">PING-PONG</text>

  <!-- Basketball area (center-left) -->
  <rect x="350" y="120" width="200" height="260" fill="#3d6b4a" stroke="#ffffff" stroke-width="2" rx="2"/>
  <circle cx="450" cy="200" r="40" fill="none" stroke="#ffffff" stroke-width="2"/>
  <line x1="350" y1="250" x2="550" y2="250" stroke="#ffffff" stroke-width="2"/>
  <circle cx="450" cy="380" r="10" fill="none" stroke="#ffffff" stroke-width="2"/>
  <text x="450" y="400" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="14" font-weight="bold">BASKETBAL</text>

  <!-- Badminton area (top-right) -->
  <rect x="650" y="80" width="280" height="160" fill="#3d6b4a" stroke="#ffffff" stroke-width="2" rx="2"/>
  <line x1="790" y1="80" x2="790" y2="240" stroke="#ffffff" stroke-width="2"/>
  <line x1="650" y1="160" x2="930" y2="160" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
  <text x="790" y="270" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="14" font-weight="bold">BADMINTON</text>

  <!-- Volleyball area (bottom-left) -->
  <rect x="80" y="350" width="400" height="280" fill="#3d6b4a" stroke="#ffffff" stroke-width="2" rx="2"/>
  <line x1="280" y1="350" x2="280" y2="630" stroke="#ffffff" stroke-width="3"/>
  <line x1="80" y1="490" x2="480" y2="490" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
  <text x="280" y="660" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="14" font-weight="bold">VOLEJBAL</text>

  <!-- Skateboard park (bottom-right) -->
  <rect x="600" y="380" width="500" height="300" fill="#3d6b4a" stroke="#ffffff" stroke-width="2" rx="2"/>
  <ellipse cx="750" cy="480" rx="80" ry="40" fill="none" stroke="#ffffff" stroke-width="2"/>
  <ellipse cx="950" cy="550" rx="80" ry="40" fill="none" stroke="#ffffff" stroke-width="2"/>
  <path d="M 640 620 Q 700 570 760 620 Q 820 670 880 620 Q 940 570 1080 620" fill="none" stroke="#ffffff" stroke-width="2"/>
  <text x="850" y="700" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="14" font-weight="bold">SKATEBOARD PARK</text>

  <!-- Corner decorations -->
  <circle cx="50" cy="50" r="15" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
  <circle cx="1150" cy="50" r="15" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
  <circle cx="50" cy="750" r="15" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
  <circle cx="1150" cy="750" r="15" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5"/>

  <!-- Title -->
  <rect x="450" y="10" width="300" height="40" fill="#2d4f36" rx="5" opacity="0.8"/>
  <text x="600" y="37" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="18" font-weight="bold">MULTIFUNKČNÍ HŘIŠTĚ</text>
</svg>
